function showModal(content,label=&#x27;Tu Saldo&#x27;){if(!document.getElementById(&#x27;modal-root&#x27;).innerHTML)lastFocus=document.activeElement;const root=document.getElementById(&#x27;modal-root&#x27;);root.innerHTML=`&lt;div class=&quot;modal-overlay&quot;&gt;&lt;section class=&quot;modal&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;${label}&quot; tabindex=&quot;-1&quot;&gt;&lt;div class=&quot;modal-head&quot;&gt;&lt;span&gt;${label.toUpperCase()}&lt;/span&gt;&lt;button data-action=&quot;close&quot; aria-label=&quot;Cerrar&quot;&gt;${icon(&#x27;close&#x27;)}&lt;/button&gt;&lt;/div&gt;${content}&lt;/section&gt;&lt;/div&gt;`;document.body.style.overflow=&#x27;hidden&#x27;;document.getElementById(&#x27;app&#x27;).inert=true;root.querySelector(&#x27;.modal&#x27;).focus();if(!modalFocusHandler){modalFocusHandler=e=&gt;{if(e.key===&#x27;Escape&#x27;){closeModal();return}if(e.key!==&#x27;Tab&#x27;)return;const elements=[...root.querySelectorAll(&#x27;button,input,select,a[href]&#x27;)].filter(e=&gt;!e.disabled);const first=elements[0],last=elements[elements.length-1];if(e.shiftKey&amp;&amp;(document.activeElement===first||document.activeElement===root.querySelector(&#x27;.modal&#x27;))){e.preventDefault();last?.focus()}else if(!e.shiftKey&amp;&amp;document.activeElement===last){e.preventDefault();first?.focus()}};document.addEventListener(&#x27;keydown&#x27;,modalFocusHandler)}}

document.addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;[data-action]&#x27;);if(!b||b.disabled)return;const action=b.dataset.action;if(action===&#x27;nav&#x27;)navigate(b.dataset.page);else if(action===&#x27;logout&#x27;){state.registered=false;navigate(&#x27;register&#x27;)}else if(action===&#x27;close&#x27;)closeModal();else if(action===&#x27;recharge&#x27;){recharge={operator:state.operator,amount:1000,phone:state.user.phone};rechargeModal()}else if(action===&#x27;operator&#x27;){recharge.phone=document.getElementById(&#x27;recharge-phone&#x27;).value;recharge.operator=b.dataset.operator;rechargeModal()}else if(action===&#x27;amount&#x27;){recharge.phone=document.getElementById(&#x27;recharge-phone&#x27;).value;recharge.amount=Number(b.dataset.amount);rechargeModal()}else if(action===&#x27;edit-recharge&#x27;)rechargeModal();else if(action===&#x27;confirm-recharge&#x27;)finishRecharge();else if(action===&#x27;pay&#x27;)payModal(Number(b.dataset.index));else if(action===&#x27;confirm-pay&#x27;)finishPay(Number(b.dataset.index));else if(action===&#x27;go-payments&#x27;)navigate(&#x27;payments&#x27;);else if(action===&#x27;notifications&#x27;)showModal(`&lt;h2&gt;Tu conexión al día.&lt;/h2&gt;${state.pending.length?`&lt;div class=&quot;notification-item&quot;&gt;&lt;strong&gt;Tu próximo pago está cerca&lt;/strong&gt;&lt;p&gt;${bs(state.pending[0].amount)} · Vence el ${state.pending[0].date}. Puedes pagarla desde Mis pagos.&lt;/p&gt;&lt;/div&gt;`:&#x27;&lt;div class=&quot;notification-item&quot;&gt;&lt;strong&gt;¡Estás al día!&lt;/strong&gt;&lt;p&gt;No tienes pagos pendientes.&lt;/p&gt;&lt;/div&gt;&#x27;}&lt;div class=&quot;notification-item&quot;&gt;&lt;strong&gt;Tu Nivel ${state.level} te acompaña&lt;/strong&gt;&lt;p&gt;Sigue pagando a tiempo para acercarte al siguiente nivel.&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;primary&quot; data-action=&quot;go-payments&quot;&gt;Ir a mis pagos&lt;/button&gt;`,&#x27;Notificaciones&#x27;);else if(action===&#x27;help&#x27;)showModal(`&lt;h2&gt;Conectamos contigo.&lt;/h2&gt;&lt;p class=&quot;modal-intro&quot;&gt;Así funciona Tu Saldo en este prototipo.&lt;/p&gt;&lt;div class=&quot;notification-item&quot;&gt;&lt;strong&gt;¿Cómo recargo?&lt;/strong&gt;&lt;p&gt;Selecciona Recargar ahora, elige tu operadora y una de las opciones de monto de tu nivel. Puedes hacer hasta 6 recargas al mes, sin importar el monto pendiente por pagar. Pagas el total del período el 15 o el 30.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;notification-item&quot;&gt;&lt;strong&gt;¿Cómo subo de nivel?&lt;/strong&gt;&lt;p&gt;Realiza tus pagos a tiempo para completar la meta de tu nivel. Encontrarás tu progreso en Inicio y Mis niveles.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;notification-item&quot;&gt;&lt;strong&gt;¿Se realizan cobros reales?&lt;/strong&gt;&lt;p&gt;No. Todas las recargas y pagos son simulados. Los datos se borran al recargar esta página.&lt;/p&gt;&lt;/div&gt;`,&#x27;Centro de ayuda&#x27;)});
document.addEventListener(&#x27;submit&#x27;,e=&gt;{if(e.target.id===&#x27;register-form&#x27;){e.preventDefault();const d=new FormData(e.target),phone=String(d.get(&#x27;phone&#x27;)).replace(/\D/g,&#x27;&#x27;).replace(/^0/,&#x27;&#x27;);const name=String(d.get(&#x27;name&#x27;)).trim(),last=String(d.get(&#x27;last&#x27;)).trim();if(name.length&lt;2||last.length&lt;2||!/^4(12|14|16|24|26)\d{7}$/.test(phone)){document.getElementById(&#x27;register-error&#x27;).textContent=&#x27;Revisa tu nombre, apellido y número de teléfono.&#x27;;return}state.user={name,last,ci:d.get(&#x27;ciType&#x27;)+&#x27;-&#x27;+d.get(&#x27;ci&#x27;),phone:&#x27;0&#x27;+phone.slice(0,3)+&#x27; &#x27;+phone.slice(3,6)+&#x27; &#x27;+phone.slice(6),email:String(d.get(&#x27;email&#x27;)).trim()};state.registered=true;state.operator=/^412/.test(phone)?&#x27;Digitel&#x27;:/^4(16|26)/.test(phone)?&#x27;Movilnet&#x27;:&#x27;Movistar&#x27;;navigate(&#x27;home&#x27;);toast(&#x27;¡Bienvenido a Tu Saldo, &#x27;+name+&#x27;! Estás en modo demo.&#x27;)}else if(e.target.id===&#x27;recharge-form&#x27;){e.preventDefault();const amount=recharge.amount;const problem=rechargeError(amount);if(problem){document.getElementById(&#x27;recharge-error&#x27;).textContent=problem;return}recharge.amount=amount;const phone=e.target.elements.phone.value.replace(/\D/g,&#x27;&#x27;).replace(/^0/,&#x27;&#x27;);if(!/^4(12|14|16|24|26)\d{7}$/.test(phone)){document.getElementById(&#x27;recharge-error&#x27;).textContent=&#x27;Revisa el número de teléfono.&#x27;;return}const prefixes={Movistar:[&#x27;414&#x27;,&#x27;424&#x27;],Digitel:[&#x27;412&#x27;],Movilnet:[&#x27;416&#x27;,&#x27;426&#x27;]};if(!prefixes[recharge.operator].includes(phone.slice(0,3))){document.getElementById(&#x27;recharge-error&#x27;).textContent=&#x27;El prefijo no coincide con &#x27;+recharge.operator+&#x27;. Revisa la operadora o el número.&#x27;;return}recharge.phone=&#x27;0&#x27;+phone.slice(0,3)+&#x27; &#x27;+phone.slice(3,6)+&#x27; &#x27;+phone.slice(6);confirmRecharge()}});
